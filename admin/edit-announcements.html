    <div class="modal-overlay" id="eventModal">
        <div class="event-form-modal">
            <div class="modal-header">
                <h3 id="modalTitle">Create New Announcement</h3>
                <i class="fas fa-times close-modal" id="closeEventModal"></i>
            </div>
            <form id="addEventForm">
                <input type="hidden" id="editEventId" value="">
                
                <div class="form-group">
                    <label>Event Title</label>
                    <input type="text" id="eventTitle" placeholder="Enter event name..." required>
                </div>

                <div class="form-group">
                    <label>What Event (Details)</label>
                    <textarea id="eventDetails" placeholder="Enter brief details about the event..." rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label>Where (Location)</label>
                    <input type="text" id="eventLocation" placeholder="Enter event location..." required>
                </div>

                <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>Start Date</label>
                        <input type="date" id="eventStartDate" required style="width: 100%;">
                    </div>
                    <div>
                        <label>Start Time</label>
                        <input type="time" id="eventStartTime" required style="width: 100%;">
                    </div>
                </div>

                <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>End Date</label>
                        <input type="date" id="eventEndDate" required style="width: 100%;">
                    </div>
                    <div>
                        <label>End Time</label>
                        <input type="time" id="eventEndTime" required style="width: 100%;">
                    </div>
                </div>

                <div class="form-group">
                    <label>Visibility</label>
                    <select id="eventVisibility" required style="width: 100%;">
                        <option value="both" selected>Both (Public & Admin)</option>
                        <option value="admin">Admin Only</option>
                        <option value="public">Public Only</option>
                    </select>
                </div>

                <div class="form-group photo-upload-group">
                    <label style="font-weight: bold; font-size: 0.85rem;">EVENT PHOTO (OPTIONAL)</label>
                    <div class="photo-upload-wrapper">
                        <div id="eventPhotoPreview" class="photo-preview-container">
                            <i class="fas fa-image default-photo-icon"></i>
                            <img src="" alt="Preview" id="loadedPhoto" style="display:none; width:100%; height:100%; object-fit:cover;">
                        </div>
                        <button type="button" id="uploadPhotoBtn" class="upload-photo-btn">Upload Photo</button>
                        <input type="file" id="eventPhotoInput" accept="image/*" style="display:none">
                    </div>
                </div>
                <button type="submit" class="submit-event-btn">Save Announcement</button>
            </form>
