    <div class="modal-overlay" id="residentModal">
        <div class="event-form-modal">
            <div class="modal-header">
                <h3 id="modalTitle">Register Resident</h3> 
                <i class="fas fa-times close-modal" id="closeResidentModal"></i>
            </div>
            <form id="addResidentForm">
                
                <div class="name-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>FIRST NAME</label>
                        <input type="text" id="resFirstName" placeholder="Juan" required>
                    </div>
                    <div class="form-group">
                        <label>MIDDLE NAME</label>
                        <input type="text" id="resMiddleName" placeholder="Protacio">
                    </div>
                    <div class="form-group">
                        <label>LAST NAME</label>
                        <input type="text" id="resLastName" placeholder="Dela Cruz" required>
                    </div>
                    <div class="form-group">
                        <label>SUFFIX</label>
                        <input type="text" id="resSuffix" placeholder="e.g. Jr., III">
                    </div>
                </div>
                <div class="name-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label for="resBirthday">BIRTHDAY</label>
                        <input type="date" id="resBirthday" required>
                    </div>
                    <div class="form-group">
                        <label>PLACE OF BIRTH</label>
                        <input type="text" id="resPlaceOfBirth" placeholder="e.g. Manila">
                    </div>
                </div>

                <div class="name-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>SEX</label>
                        <select id="resGender" required>
                            <option value="" disabled selected>Select...</option>
                            <option value="M">M</option>
                            <option value="F">F</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="resStatus">CIVIL STATUS</label>
                        <select id="resStatus" required>
                            <option value="" disabled selected>Select...</option>
                            <option value="Single">Single</option>
                            <option value="Married">Married</option>
                            <option value="Widowed">Widowed</option>
                            <option value="Separated">Separated</option>
                        </select>
                    </div>
                </div>

                <div class="name-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>CITIZENSHIP</label>
                        <input type="text" id="resCitizenship" placeholder="e.g. Filipino" value="Filipino">
                    </div>
                    <div class="form-group">
                        <label>OCCUPATION</label>
                        <input type="text" id="resOccupation" placeholder="e.g. Teacher">
                    </div>
                </div>

                <div class="name-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>HOUSE NUMBER</label>
                        <input type="text" id="resHouse" placeholder="e.g. 123" required>
                    </div>
                    <div class="form-group">
                        <label>STREET NAME</label>
                        <input type="text" id="resStreetName" placeholder="e.g. Rizal St.">
                    </div>
                </div>

                <div class="form-group">
                    <label>FULL ADDRESS</label>
                    <input type="text" id="resAddress" placeholder="e.g. 123 Rizal St., Barangay 663, Manila" required>
                </div>

                <div class="name-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group">
                        <label>HOUSE HEAD RELATIONSHIP</label>
                        <input type="text" id="resHouseHeadRelationship" placeholder="e.g. Son, Daughter, Spouse">
                    </div>
                    <div class="form-group">
                        <label>VOTER STATUS</label>
                        <select id="resVoterStatus" required>
                            <option value="" disabled selected>Select...</option>
                            <option value="Registered">Registered</option>
                            <option value="Unregistered">Unregistered</option>
                        </select>
                    </div>
                </div>

                    <input type="hidden" id="editResidentId" value="">
                    

                <button type="submit" class="submit-event-btn">Save to List</button>
